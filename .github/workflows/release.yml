name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Create the GitHub Release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Verify that the tag matches every ASDF system version.
      - name: Verify tag matches .asd version
        env:
          PACKAGE: cl-cowsay
        run: |
          set -euo pipefail
          asd_file="$PACKAGE.asd"
          if [[ ! -f "$asd_file" ]]; then
            echo "::error::$asd_file does not exist; the tag cannot be checked against any declared :version" >&2
            exit 1
          fi
          scan_output="$(perl -ne '
            my $head = qr{\(\s*(?:[A-Za-z0-9_+.-]+::?)?defsystem(?![-:\w])}i;
            if (!$q && !$b) {
              $vc++ if /^\s*(?:$head\s+\S+\s+)?:version\s+"/;
              if (/^\s*(?:$head\s+\S+\s+)?:version\s+"([^"]*)"/) {
                $ec++;
                push @versions, $1 unless $seen{$1}++;
              }
              $dc++ if /^\s*$head/;
            }
            while (m{(\\.|\#\||\|\#|[";])}g) {
              my $t = $1;
              if ($b) { $b++ if $t eq q{#|}; $b-- if $t eq q{|#}; next }
              next if length($t) > 1 && $t ne q{#|};
              if ($t eq q{"}) { $q = !$q; next }
              next if $q;
              if ($t eq q{#|}) { $b++; next }
              last;
            }
            END { print 0 + $vc, "\n", 0 + $dc, "\n", 0 + $ec, "\n", map { "$_\n" } @versions }' "$asd_file")"
          mapfile -t scan_lines <<< "$scan_output"
          version_count="${scan_lines[0]}"
          defsystem_count="${scan_lines[1]}"
          terminated_count="${scan_lines[2]}"
          asd_version_list=("${scan_lines[@]:3}")
          asd_versions="$(printf '%s\n' "${asd_version_list[@]}")"
          tag_version="${GITHUB_REF_NAME:-}"
          tag_version="${tag_version#v}"
          echo "asd={${asd_versions//$'\n'/, }} versions=$version_count defsystems=$defsystem_count terminated=$terminated_count tag=$tag_version"
          if (( version_count != terminated_count )); then
            echo "::error::$asd_file has $(( version_count - terminated_count )) :version declaration(s) whose value is missing its closing quote; the unterminated string runs on and hides every later form from the scan, so no count below can be trusted. Fix the quoting and re-tag" >&2
            exit 1
          fi
          if [[ -z "$asd_versions" ]]; then
            echo "::error::$asd_file declares no :version at all; every defsystem form must carry one matching the release tag" >&2
            exit 1
          fi
          if (( version_count != defsystem_count )); then
            echo "::error::$asd_file declares $version_count :version form(s) across $defsystem_count defsystem form(s); each defsystem must carry its own :version, so a system is about to ship unversioned. Add the missing :version \"$tag_version\" and re-tag" >&2
            exit 1
          fi
          if (( ${#asd_version_list[@]} > 1 )); then
            echo "::error::$asd_file declares ${#asd_version_list[@]} different :version values (${asd_versions//$'\n'/, }); every defsystem form must declare the same version. Set them all to $tag_version and re-tag" >&2
            exit 1
          fi
          if [[ -z "$tag_version" ]]; then
            echo "::error::GITHUB_REF_NAME is empty, so there is no tag to check $asd_file version ${asd_version_list[0]} against" >&2
            exit 1
          fi
          if [[ "${asd_version_list[0]}" != "$tag_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match $asd_file version ${asd_version_list[0]}" >&2
            exit 1
          fi

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Verify the tagged tree
        run: nix flake check --print-build-logs

      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
